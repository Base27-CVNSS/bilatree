name: Triển khai BilaTree lên GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Xuất bản website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Đóng gói website tĩnh
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v5
